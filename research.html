      font-weight: normal;
      text-align: left;
    }

    a {
      color: #b55212;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .profile {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .profile img {
        margin: 0 0 20px 0;
      }

      .text-content {
        width: 100%;
      }

      body {
        font-size: 16px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }

      nav {
        text-align: center;
      }

      nav a {
        display: inline-block;
        margin: 10px;
        font-size: 18px;
      }
    }
  </style>
